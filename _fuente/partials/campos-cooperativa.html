<div class="field"><label for="f-entidad">Nombre de la cooperativa o entidad</label><input id="f-entidad" name="f-entidad" required autocomplete="organization"></div>
      <div class="row2">
        <div class="field"><label for="f-nombre">Persona de contacto</label><input id="f-nombre" name="f-nombre" required autocomplete="name"></div>
        <div class="field"><label for="f-cargo">Cargo (opcional)</label><input id="f-cargo" name="f-cargo" autocomplete="organization-title"></div>
      </div>
      <div class="row2">
        <div class="field"><label for="f-email">Correo electrónico</label><input id="f-email" name="f-email" type="email" required autocomplete="email"></div>
        <div class="field"><label for="f-telefono">Teléfono</label><input id="f-telefono" name="f-telefono" type="tel" autocomplete="tel"></div>
      </div>
      <div class="row2">
        <div class="field"><label for="f-socios">Número aproximado de socios</label>
          <select id="f-socios" name="f-socios" required><option value="">Selecciona una opción</option><option>Menos de 50</option><option>De 50 a 200</option><option>De 200 a 1.000</option><option>Más de 1.000</option></select></div>
        <div class="field"><label for="f-tecnicos">Técnicos de campo</label>
          <select id="f-tecnicos" name="f-tecnicos"><option value="">Selecciona una opción</option><option>1 o 2</option><option>De 3 a 10</option><option>Más de 10</option></select></div>
      </div>
      <div class="field"><label for="f-mensaje">Cultivos principales y lo que necesitáis (opcional)</label><textarea id="f-mensaje" name="f-mensaje"></textarea></div>
