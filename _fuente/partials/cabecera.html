<body>
{{ gtm_body }}
<a class="saltar" href="#contenido">Saltar al contenido</a>
<div class="topbar"><div class="wrap">
  <div class="tb-items">
    <span class="tb-nuevo">{{ ico:microfono }}Nuevo: anota por voz o chat con IA</span>
    <span>{{ ico:mail }}<a href="mailto:{{ email }}">{{ email }}</a></span>
  </div>
  <div class="tb-items">
    <span>{{ ico:regalo }}CuaderHuerta gratis · precios con IGIC incluido</span>
    <a class="tb-app" href="{{ app_entrar }}" rel="noopener">{{ ico:llave }}Entrar en mi cuaderno</a>
  </div>
</div></div>

<header class="site-header"><div class="wrap">
  <a class="brand" href="index.html" aria-label="CuaderCampo, inicio">{{ logo }}</a>
  <button class="nav-toggle" id="navToggle" aria-expanded="false" aria-controls="mainNav" aria-label="Abrir menú">{{ ico:menu }}</button>
  <nav class="main-nav" id="mainNav" aria-label="Navegación principal">
    <ul>
      {{ nav_items }}
      <li class="nav-mas" hidden>
        <button type="button" aria-expanded="false" aria-haspopup="true">Más {{ ico:abajo }}</button>
        <ul class="nav-drop"></ul>
      </li>
      <li class="cta"><a class="btn btn-primary" href="{{ app_crear }}" rel="noopener">{{ ico:mas }}Cuenta gratis</a></li>
    </ul>
  </nav>
</div></header>
